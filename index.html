<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Спорт-штаб</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg: var(--tg-theme-bg-color, #17212b);
    --card: var(--tg-theme-secondary-bg-color, #232e3c);
    --text: var(--tg-theme-text-color, #f5f5f5);
    --hint: var(--tg-theme-hint-color, #8b98a5);
    --link: var(--tg-theme-link-color, #62bcf9);
    --btn: var(--tg-theme-button-color, #3390ec);
    --btn-text: var(--tg-theme-button-text-color, #fff);
    --green:#4dd07a; --red:#ff6b6b; --amber:#ffc93c;
    --line: rgba(255,255,255,.07);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-bottom:24px}
  header{padding:16px 16px 8px;display:flex;align-items:center;gap:12px}
  header img{width:52px;height:52px;flex:0 0 auto;
    filter:drop-shadow(0 2px 10px rgba(212,175,55,.28))}
  h1{margin:0;font-size:20px;font-weight:650;letter-spacing:-.02em}
  .sub{color:var(--hint);font-size:13px;margin-top:2px}
  nav{display:flex;gap:6px;padding:12px 16px;overflow-x:auto;scrollbar-width:none;
    position:sticky;top:0;background:var(--bg);z-index:5}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:0 0 auto;background:var(--card);color:var(--hint);border:0;
    padding:8px 14px;border-radius:18px;font-size:14px;font-weight:500;cursor:pointer}
  nav button.on{background:var(--btn);color:var(--btn-text)}
  main{padding:0 16px}
  .card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;
    position:relative;overflow:hidden}
  .card.locked{border:1px solid var(--line)}
  a.card.plan{display:block;text-decoration:none;color:inherit;
    border:1px solid rgba(212,175,84,.22)}
  a.card.plan .tag.bet{background:rgba(212,175,84,.16);color:#d6af54}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .teams{font-weight:600;font-size:15px}
  .meta{color:var(--hint);font-size:12.5px;margin-top:3px}
  .tag{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 8px;
    border-radius:8px;background:rgba(255,255,255,.08);color:var(--hint);white-space:nowrap}
  .tag.bet{background:rgba(77,208,122,.16);color:var(--green)}
  .tag.pass{background:rgba(255,255,255,.08);color:var(--hint)}
  .tag.live{background:rgba(255,107,107,.16);color:var(--red)}
  .tag.lock{background:rgba(255,201,60,.14);color:var(--amber)}
  .tag.win{background:rgba(77,208,122,.16);color:var(--green)}
  .tag.lose{background:rgba(255,107,107,.16);color:var(--red)}
  .rank{position:absolute;top:12px;right:12px;font-size:11px;color:var(--hint);opacity:.6}
  .scen{margin-top:10px;font-size:13.5px;color:var(--hint)}
  .verdict{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .pick{font-weight:650;font-size:15px}
  .nums{display:flex;gap:14px;margin-top:6px;font-size:13px;color:var(--hint);flex-wrap:wrap}
  .nums b{color:var(--text);font-weight:600}
  .why{margin-top:8px;font-size:13.5px;color:var(--hint);white-space:pre-wrap}
  .blur{filter:blur(5px);opacity:.5;user-select:none;pointer-events:none}
  .unlock{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:10px}
  .unlock span{font-size:13px;color:var(--hint)}
  .unlock a{background:var(--btn);color:var(--btn-text);text-decoration:none;
    padding:7px 12px;border-radius:10px;font-size:13px;font-weight:600;white-space:nowrap}
  table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
  th{text-align:left;color:var(--hint);font-weight:500;padding:5px 0;font-size:12px}
  td{padding:5px 0;border-top:1px solid rgba(255,255,255,.06)}
  td:last-child,th:last-child{text-align:right}
  .val-pos{color:var(--green);font-weight:600}
  .val-neg{color:var(--hint)}
  .sect{color:var(--hint);font-size:12px;font-weight:600;letter-spacing:.04em;
    text-transform:uppercase;margin:18px 2px 8px}
  .sect:first-child{margin-top:4px}
  .stat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .stat .card{margin:0;text-align:center;padding:16px 10px}
  .stat .big{font-size:24px;font-weight:650;letter-spacing:-.02em}
  .stat .lbl{color:var(--hint);font-size:12px;margin-top:2px}
  .empty{color:var(--hint);text-align:center;padding:40px 20px;font-size:14px}
  .go{position:sticky;bottom:12px;margin:16px;padding:14px;border-radius:14px;border:0;
    width:calc(100% - 32px);background:var(--btn);color:var(--btn-text);
    font-size:16px;font-weight:600;cursor:pointer}
  .upd{text-align:center;color:var(--hint);font-size:12px;padding:8px 0 2px}
</style>
</head>
<body>

<header>
  <img src="logo.png" alt="Спорт-штаб">
  <div>
    <h1>Спорт-штаб</h1>
    <div class="sub" id="sub">загрузка…</div>
  </div>
</header>

<nav>
  <button class="on" data-tab="day">День</button>
  <button data-tab="bets">Ставки</button>
  <button data-tab="pass">Пасы</button>
  <button data-tab="stats">Дистанция</button>
</nav>

<main id="main"><div class="empty">Загрузка данных…</div></main>

<button class="go" id="go">Го — запустить разбор дня</button>
<div class="upd" id="upd"></div>

<script>
const API = 'https://sport-shtab-bot.noeliagarat843.workers.dev';
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

let DATA = null, STATS = null, TAB = 'day';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICON = { futbol: '⚽️', tennis: '🎾' };

async function load() {
  try {
    const r = await fetch(API + '/api/day?_=' + Date.now(), {
      headers: { 'x-init-data': tg?.initData || '' }
    });
    DATA = await r.json();
  } catch (e) {
    DATA = { picks: [], subscribed: false, day: null };
  }
  const n = (DATA.picks || []).length;
  const withBet = (DATA.picks || []).filter(p => p.market).length;
  $('sub').textContent = n
    ? `${DATA.day} · ${n} разборов, ставок ${withBet}` + (DATA.subscribed ? ' · подписка активна' : '')
    : 'на сегодня разборов ещё нет';
  $('upd').textContent = DATA.generated ? 'обновлено ' + DATA.generated.slice(11, 16) : '';
  render();
}

async function loadStats() {
  if (STATS) return;
  try { STATS = await (await fetch(API + '/api/stats')).json(); }
  catch (e) { STATS = { totals: [], days: [] }; }
}

function render() {
  const m = $('main');
  const all = DATA?.picks || [];
  if (TAB === 'day')    m.innerHTML = dayView(all);
  if (TAB === 'bets')   m.innerHTML = listView(all.filter(p => p.market || p.locked));
  // «пас» — тоже результат разбора, поэтому у него своя вкладка, а не свалка в общем списке
  if (TAB === 'pass')   m.innerHTML = listView(all.filter(p => !p.market && !p.locked));
  if (TAB === 'stats')  { loadStats().then(() => { if (TAB === 'stats') m.innerHTML = statsView(); }); }
}

function dayView(list) {
  if (!list.length) return `<div class="empty">Разборов на сегодня ещё нет.<br>Штаб собирает день.</div>`;
  const grp = [
    ['Открыто всем', list.filter(p => p.tier === 'free')],
    ['Весь день · по подписке', list.filter(p => p.tier !== 'free')],
  ];
  return grp.filter(([, x]) => x.length)
    .map(([t, x]) => `<div class="sect">${t} · ${x.length}</div>` + x.map(card).join('')).join('')
    + plansBlock();
}

function listView(list) {
  if (!list.length) return `<div class="empty">Пусто.</div>`;
  return list.map(card).join('');
}

function card(p) {
  const icon = ICON[p.sport] || '⚽️';
  const res = p.result === 'win' ? '<span class="tag win">зашла</span>'
            : p.result === 'lose' ? '<span class="tag lose">не зашла</span>'
            : p.locked ? '<span class="tag lock">🔒 подписка</span>'
            : p.market ? '<span class="tag bet">ставка</span>'
            : '<span class="tag pass">пас</span>';

  const head = `
    <div class="row">
      <div>
        <div class="teams">${icon} ${esc(p.match)}</div>
        <div class="meta">${esc(p.league)}${p.starts_at ? ' · ' + esc(p.starts_at) : ''}</div>
      </div>
      ${res}
    </div>
    ${p.scenario ? `<div class="scen">${esc(p.scenario)}${p.locked ? '…' : ''}</div>` : ''}`;

  if (p.locked) return `
    <div class="card locked">
      ${head}
      <div class="verdict blur">
        <div class="pick">Ставка скрыта</div>
        <div class="nums"><span>кэф <b>0.00</b></span><span>вер. <b>00%</b></span><span>вэлью <b>0.00</b></span></div>
      </div>
      <div class="unlock">
        <span>Разбор и ставка — по подписке</span>
        ${plansLink()}
      </div>
    </div>`;

  return `
    <div class="card">
      ${head}
      <div class="verdict">
        ${p.market
          ? `<div class="pick">${esc(p.market)}</div>
             <div class="nums">
               <span>кэф <b>${esc(p.odds)}</b></span>
               <span>вер. <b>${esc(p.probability)}</b></span>
               <span>вэлью <b class="${parseFloat(p.value) >= 1.05 ? 'val-pos' : 'val-neg'}">${esc(p.value)}</b></span>
             </div>`
          : `<div class="pick">Вердикт: пас</div>`}
        ${p.reasoning ? `<div class="why">${esc(p.reasoning)}</div>` : ''}
        ${marketsTable(p.markets_json)}
        ${p.risks ? `<div class="why"><b>Риски.</b> ${esc(p.risks)}</div>` : ''}
      </div>
    </div>`;
}

function plansLink() {
  const p = DATA?.plans || [];
  if (!p.length) return '';
  // на карточке — самый дешёвый вход, весь список открывается по кнопке внизу
  const cheapest = p.reduce((a, b) => (b.price < a.price ? b : a));
  return `<a href="${esc(cheapest.url)}" target="_blank">от ${cheapest.price} ₽</a>`;
}

function plansBlock() {
  const p = DATA?.plans || [];
  if (!p.length || DATA?.subscribed) return '';
  return `<div class="sect">Полный доступ</div>` + p.map(x => `
    <a class="card plan" href="${esc(x.url)}" target="_blank">
      <div class="row">
        <div><div class="teams">${esc(x.title)}</div>
          <div class="meta">${x.id === 'lifetime' ? 'разовый платёж, без срока' :
            x.id === 'year' ? 'выгоднее месячного вчетверо' : 'доступ на 30 дней'}</div></div>
        <span class="tag bet">${x.price} ₽</span>
      </div>
    </a>`).join('');
}

function marketsTable(raw) {
  if (!raw) return '';
  let rows; try { rows = JSON.parse(raw); } catch { return ''; }
  if (!Array.isArray(rows) || !rows.length) return '';
  return `<table><tr><th>Рынок</th><th>Кэф</th><th>Вэлью</th></tr>` +
    rows.map(r => `<tr><td>${esc(r.market)}</td><td>${esc(r.odds)}</td>
      <td class="${parseFloat(r.value) >= 1.05 ? 'val-pos' : 'val-neg'}">${esc(r.value)}</td></tr>`).join('') +
    `</table>`;
}

function statsView() {
  const t = STATS?.totals || [];
  const get = k => Number(t.find(x => x.result === k)?.n || 0);
  const win = get('win'), lose = get('lose'), push = get('push');
  const bets = win + lose + push;
  if (!bets) return `<div class="empty">Статистики пока нет.<br>Нужно минимум 30 ставок для выводов.</div>`;
  const hit = Math.round(win / (win + lose) * 100);
  const days = (STATS?.days || []).map(d =>
    `<tr><td>${esc(d.day)}</td><td>${d.w}/${d.n}</td>
     <td class="${d.w * 2 >= d.n ? 'val-pos' : 'val-neg'}">${Math.round(d.w / d.n * 100)}%</td></tr>`).join('');
  return `
    <div class="stat">
      <div class="card"><div class="big">${bets}</div><div class="lbl">ставок</div></div>
      <div class="card"><div class="big ${hit >= 55 ? 'val-pos' : 'val-neg'}">${hit}%</div><div class="lbl">проходимость</div></div>
      <div class="card"><div class="big">${win}</div><div class="lbl">зашло</div></div>
      <div class="card"><div class="big">${lose}</div><div class="lbl">мимо</div></div>
    </div>
    ${days ? `<div class="card" style="margin-top:10px">
      <div class="lbl" style="text-align:left">По дням</div>
      <table><tr><th>День</th><th>Зашло</th><th>%</th></tr>${days}</table></div>` : ''}
    <div class="card"><div class="why">Проходимость сама по себе ничего не значит без среднего коэффициента: 60% при кэфе 1.40 — это минус.</div></div>`;
}

document.querySelectorAll('nav button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('nav button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    TAB = b.dataset.tab;
    render();
  };
});

$('go').onclick = () => {
  if (tg?.sendData) { tg.sendData(JSON.stringify({ cmd: 'go' })); tg.close(); }
  else alert('Команда «Го» отправляется из Telegram.');
};

load();
</script>
</body>
</html>
